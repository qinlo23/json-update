[project]
name = "json-update"
version = "0.1.0"
description = "Windows JSON 批量字段筛选与安全编辑工具"
readme = "README.md"
authors = [
    { name = "qinlo", email = "vividqlj@outlook.com" }
]
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
json-update = "json_update:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
