name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.10
          uv sync --locked --group dev --group build
      - name: Run tests
        env:
          PYTHONWARNDEFAULTENCODING: '1'
        run: uv run --no-sync pytest -q -W error::EncodingWarning
      - name: Build standalone executable
        run: uv run --no-sync pyinstaller --clean --noconfirm json-update.spec
      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: JSON-Batch-Editor-Windows-x64
          path: dist/JSON-Batch-Editor.exe
          if-no-files-found: error
          retention-days: 30
